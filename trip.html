<meta property="og:description" content="Mark the days you can't make it and see the best windows for everyone.">
<meta property="og:image" content="https://whencanwego.net/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<script>
  /* Legacy entry point. Planners used to live at /trip?t=<id>; they're now
     events at /event?e=<id> (event.html). Forward old links there — we go to
     the literal /event.html file so it also works on the local dev server;
     event.html normalises the address bar to /event?e=<id>. */
  (function(){
    var p = new URLSearchParams(location.search);
    var id = p.get("e") || p.get("t") || p.get("r");
    if(id && /^[A-Za-z0-9_-]+$/.test(id)) location.replace("/event.html?e=" + id);
    else location.replace("/");
  })();
</script>
</head>

</html>
